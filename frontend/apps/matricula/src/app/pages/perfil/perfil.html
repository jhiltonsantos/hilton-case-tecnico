<div class="pagina">
  <lib-cabecalho-pagina eyebrow="Matrícula" titulo="Meu perfil" />

  <p-table [value]="linhas()" dataKey="campo">
    <ng-template #header>
      <tr>
        <th>Campo</th>
        <th>Valor</th>
      </tr>
    </ng-template>
    <ng-template #body let-linha>
      <tr>
        <td>{{ linha.campo }}</td>
        <td>{{ linha.valor }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
