quarkus.application.name=backend

quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}

quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

# Swagger-UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.oauth-client-id=matricula-app

quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

quarkus.oidc.auth-server-url=http://keycloak:8080/realms/matricula
quarkus.oidc.client-id=matricula-app
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=any

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
