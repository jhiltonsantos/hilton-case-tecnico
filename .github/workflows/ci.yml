name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  backend:
    name: Backend (Gradle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/**/gradle-wrapper.properties') }}

      - name: Testes
        run: ./gradlew test --console=plain

  frontend:
    name: Frontend (Nx affected)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: corepack enable
      - run: yarn install --immutable

      - uses: nrwl/nx-set-shas@v4
        with:
          working-directory: frontend

      - name: Lint, testes e build dos projetos afetados
        run: yarn nx affected -t lint test build

  docker-build:
    name: Build das imagens Docker (validacao, sem push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem do backend
        run: docker build -f backend/src/main/docker/Dockerfile.jvm -t matricula-backend:ci backend

      - name: Build da imagem do frontend
        run: docker build -t matricula-frontend:ci frontend
